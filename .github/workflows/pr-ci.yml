name: Node.js CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:

  verify:
    runs-on: ubuntu-latest

    env:
        DATABASE_URL: "postgresql://user:password@localhost:5432/postgre"

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run prisma:generate

    - name: Build project
      run: npm run build

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run prisma migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: migrate
    permissions:
      packages: write
      contents: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
    - uses: actions/checkout@v4

    - name: Calculate Commit SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build Docker Image and Tag with SHA and Latest
      run: |
        docker build -t $IMAGE_NAME:$SHORT_SHA .
        docker tag $IMAGE_NAME:$SHORT_SHA $IMAGE_NAME:latest

    - name: Login to GHCR and Publish Images
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push $IMAGE_NAME:$SHORT_SHA
        docker push $IMAGE_NAME:latest
